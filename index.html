<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>やんさんチャット</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f4ef;
      --panel: #ffffff;
      --ink: #1d1f22;
      --muted: #676b70;
      --line: #d8d2c7;
      --primary: #0b7a4b;
      --primary-dark: #075f3a;
      --accent: #be4b2f;
      --focus: #1d6fd8;
      --shadow: 0 10px 30px rgba(43, 38, 31, 0.1);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(246, 244, 239, 0.95), rgba(246, 244, 239, 1)),
        radial-gradient(circle at top left, rgba(11, 122, 75, 0.14), transparent 36rem);
      color: var(--ink);
      line-height: 1.7;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      touch-action: manipulation;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    button:focus-visible,
    textarea:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(29, 111, 216, 0.28);
      outline-offset: 2px;
    }

    .app {
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 18px 14px 44px;
    }

    header {
      padding: 18px 2px 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 42px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      margin: 14px 0;
    }

    .settings {
      display: grid;
      gap: 12px;
      background: #fffaf0;
      border-color: #dec99d;
      box-shadow: none;
    }

    .settings summary {
      min-height: 48px;
      display: flex;
      align-items: center;
      font-weight: 800;
      cursor: pointer;
    }

    .field {
      display: grid;
      gap: 8px;
      margin: 0 0 16px;
    }

    label,
    .label {
      font-size: 17px;
      font-weight: 800;
    }

    .sender {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      width: fit-content;
      padding: 0 16px;
      background: #e7f3ed;
      color: #06462b;
      border: 1px solid #b9ddca;
      border-radius: 8px;
      font-size: 19px;
      font-weight: 800;
    }

    input[type="url"],
    textarea {
      width: 100%;
      border: 2px solid #b9b3aa;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
    }

    input[type="url"] {
      min-height: 52px;
      padding: 10px 12px;
      font-size: 16px;
    }

    textarea {
      min-height: 170px;
      resize: vertical;
      padding: 14px;
      font-size: 20px;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .primary {
      background: var(--primary);
      color: #fff;
      font-size: 20px;
      padding: 0 18px;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #ece7de;
      color: #222;
      border: 1px solid #cbc2b4;
      padding: 0 16px;
    }

    .ghost {
      background: transparent;
      color: var(--primary-dark);
      border: 2px solid #9fcdb8;
      padding: 0 16px;
    }

    .danger {
      color: var(--accent);
      border-color: #e7b1a3;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      margin: 20px 0 10px;
    }

    h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .status {
      min-height: 30px;
      margin: 12px 0 0;
      color: var(--muted);
      font-weight: 700;
    }

    .status.error {
      color: #a42d18;
    }

    .status.success {
      color: var(--primary-dark);
    }

    .messages {
      display: grid;
      gap: 12px;
    }

    .message {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 5px 18px rgba(43, 38, 31, 0.07);
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .message-name {
      font-size: 18px;
      font-weight: 900;
    }

    .message-date {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .message-body {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 10px 0 14px;
      font-size: 18px;
    }

    .empty {
      padding: 22px 16px;
      border: 2px dashed #c6bcae;
      border-radius: 8px;
      color: var(--muted);
      text-align: center;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.62);
    }

    .reply-note {
      display: none;
      border-left: 5px solid var(--primary);
      background: #eef8f3;
      padding: 12px 14px;
      margin: 0 0 14px;
      border-radius: 6px;
      font-weight: 700;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .reply-note.active {
      display: block;
    }

    .small {
      color: var(--muted);
      font-size: 14px;
      margin: 0;
    }

    @media (min-width: 680px) {
      .app {
        padding-top: 28px;
      }

      .panel {
        padding: 24px;
      }

      .actions {
        grid-template-columns: 1fr auto;
      }

      .primary {
        min-width: 220px;
      }
    }

    @media (max-width: 420px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .toolbar .secondary {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>やんさんチャット</h1>
      <p class="subtitle">LINEグループへの送信と、グループ投稿の確認ができます。</p>
    </header>

    <section class="panel" aria-labelledby="formTitle">
      <h2 id="formTitle">メッセージ送信</h2>
      <p class="status" id="replyNote" aria-live="polite"></p>

      <form id="messageForm">
        <div class="field">
          <span class="label">送信者名</span>
          <span class="sender">やんさん</span>
        </div>

        <div class="field">
          <label for="messageText">本文</label>
          <textarea id="messageText" required placeholder="ここにメッセージを入力してください"></textarea>
        </div>

        <div class="actions">
          <button class="primary" id="sendButton" type="submit">LINEへ送信</button>
          <button class="ghost danger" id="clearReplyButton" type="button" hidden>返信を取り消す</button>
        </div>
      </form>

      <p class="status" id="sendStatus" role="status" aria-live="polite"></p>
    </section>

    <section aria-labelledby="listTitle">
      <div class="toolbar">
        <h2 id="listTitle">メッセージ一覧</h2>
        <button class="secondary" id="reloadButton" type="button" disabled>停止中</button>
      </div>
      <div class="messages" id="messages" aria-live="polite">
        <div class="empty">現在、一覧取得は停止中です。</div>
      </div>
      <p class="status" id="listStatus" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var SENDER_NAME = "やんさん";
      var GAS_URL = "https://script.google.com/macros/s/AKfycbwFI1JIj6WL2I2p1Fto8BBjpv5w4SQAiixaesjsiUIXx-RXoirQM3HOeeJ1FW38RwkA_w/exec";
      var messageForm = document.getElementById("messageForm");
      var messageText = document.getElementById("messageText");
      var sendButton = document.getElementById("sendButton");
      var sendStatus = document.getElementById("sendStatus");
      var listStatus = document.getElementById("listStatus");
      var messages = document.getElementById("messages");
      var reloadButton = document.getElementById("reloadButton");
      var replyNote = document.getElementById("replyNote");
      var clearReplyButton = document.getElementById("clearReplyButton");
      var replyTarget = null;

      showStatus(listStatus, "GASへのGETアクセスは停止しています。", "");

      clearReplyButton.addEventListener("click", function () {
        replyTarget = null;
        replyNote.textContent = "";
        replyNote.className = "status";
        clearReplyButton.hidden = true;
        messageText.value = "";
        messageText.focus();
      });

      messageForm.addEventListener("submit", function (event) {
        event.preventDefault();
        sendMessage();
      });

      function sendMessage() {
        var body = messageText.value.trim();
        if (!body) {
          showStatus(sendStatus, "本文を入力してください。", "error");
          messageText.focus();
          return;
        }

        var lineText = SENDER_NAME + "より\n\n" + body;
        var payload = {
          sender: SENDER_NAME,
          text: lineText,
          body: body,
          replyTo: replyTarget
        };

        messageText.value = "";
        replyTarget = null;
        replyNote.textContent = "";
        replyNote.className = "status";
        clearReplyButton.hidden = true;
        showStatus(sendStatus, "送信しました。", "success");

        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        }).catch(function () {
          showStatus(sendStatus, "送信できなかった可能性があります。通信状態を確認してください。", "error");
        });
      }

      function renderMessages(rows) {
        messages.innerHTML = "";
        if (!rows.length) {
          messages.innerHTML = '<div class="empty">まだメッセージはありません。</div>';
          return;
        }

        rows.forEach(function (row) {
          var item = document.createElement("article");
          item.className = "message";

          var meta = document.createElement("div");
          meta.className = "message-meta";

          var name = document.createElement("span");
          name.className = "message-name";
          name.textContent = getField(row, ["sender", "name", "userName", "送信者名"]) || "不明";

          var date = document.createElement("time");
          date.className = "message-date";
          var rawDate = getField(row, ["datetime", "timestamp", "date", "日時"]);
          date.textContent = formatDate(rawDate);
          if (rawDate && !Number.isNaN(new Date(rawDate).getTime())) {
            date.dateTime = new Date(rawDate).toISOString();
          }

          var body = document.createElement("div");
          body.className = "message-body";
          body.textContent = getField(row, ["body", "text", "message", "本文"]) || "";

          var replyButton = document.createElement("button");
          replyButton.className = "ghost";
          replyButton.type = "button";
          replyButton.textContent = "返信する";
          replyButton.addEventListener("click", function () {
            startReply(name.textContent, body.textContent);
          });

          meta.appendChild(name);
          meta.appendChild(date);
          item.appendChild(meta);
          item.appendChild(body);
          item.appendChild(replyButton);
          messages.appendChild(item);
        });
      }

      function startReply(name, text) {
        var firstLine = (text || "").split(/\r?\n/)[0] || "";
        var quote = "＞" + name + "：" + firstLine;
        replyTarget = {
          sender: name,
          body: text
        };
        messageText.value = quote + "\n";
        replyNote.textContent = "返信先: " + quote;
        replyNote.className = "status reply-note active";
        clearReplyButton.hidden = false;
        messageText.focus();
        messageText.setSelectionRange(messageText.value.length, messageText.value.length);
        window.scrollTo({
          top: messageForm.getBoundingClientRect().top + window.scrollY - 16,
          behavior: "smooth"
        });
      }

      function showStatus(element, message, type) {
        element.textContent = message;
        element.className = "status" + (type ? " " + type : "");
      }

      function getField(row, keys) {
        for (var i = 0; i < keys.length; i += 1) {
          if (row && row[keys[i]] !== undefined && row[keys[i]] !== null) {
            return String(row[keys[i]]);
          }
        }
        return "";
      }

      function sortNewestFirst(rows) {
        return rows.slice().sort(function (a, b) {
          var aTime = Date.parse(getField(a, ["datetime", "timestamp", "date", "日時"])) || 0;
          var bTime = Date.parse(getField(b, ["datetime", "timestamp", "date", "日時"])) || 0;
          return bTime - aTime;
        });
      }

      function formatDate(value) {
        if (!value) {
          return "日時不明";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return new Intl.DateTimeFormat("ja-JP", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }
    }());
  </script>
</body>
</html>
