<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f9cc7">
  <title>やんさんチャット</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #8bb4d9;
      --header: #6f9cc7;
      --chat: #8bb4d9;
      --mine: #8de055;
      --other: #ffffff;
      --ink: #17202a;
      --muted: #5c6670;
      --line: rgba(34, 48, 62, 0.18);
      --panel: #f7f8fa;
      --button: #0b7a4b;
      --button-dark: #075f3a;
      --danger: #a42d18;
      --secondary: #2f6f9f;
      --unread: #d82f2f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--chat);
      color: var(--ink);
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.7);
      outline-offset: 2px;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--chat);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 10px 14px;
      background: var(--header);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .current-group {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-group.has-unread {
      color: #fff8d8;
    }

    .status {
      min-height: 22px;
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .status.error {
      color: #ffe1d9;
    }

    .notify-button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      padding: 8px 10px;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .notify-button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .chat {
      min-height: 0;
      overflow-y: auto;
      padding: 14px 12px 18px;
      scroll-behavior: smooth;
    }

    .messages {
      width: min(760px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .empty {
      width: min(560px, 100%);
      margin: 28px auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      color: #273746;
      text-align: center;
      font-weight: 800;
    }

    .older-toggle {
      justify-self: center;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--secondary);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      padding: 10px 16px;
      touch-action: manipulation;
    }

    .message {
      display: grid;
      max-width: 82%;
      gap: 4px;
    }

    .message.other {
      justify-self: start;
    }

    .message.mine {
      justify-self: end;
    }

    .message-meta {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 0 6px;
      color: rgba(23, 32, 42, 0.74);
      font-size: 12px;
      font-weight: 800;
    }

    .message.mine .message-meta {
      justify-content: flex-end;
    }

    .bubble {
      position: relative;
      width: fit-content;
      max-width: 100%;
      padding: 10px 13px;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.55;
    }

    .bubble a {
      color: #0757b8;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 2px;
      overflow-wrap: anywhere;
    }

    .message.mine .bubble a {
      color: #064a9a;
    }

    .message.other .bubble {
      background: var(--other);
      border-top-left-radius: 3px;
    }

    .message.mine .bubble {
      justify-self: end;
      background: var(--mine);
      border-top-right-radius: 3px;
    }

    .bubble.image-bubble {
      padding: 5px;
      line-height: 0;
    }

    .message-image {
      display: block;
      width: min(68vw, 300px);
      max-width: 100%;
      max-height: 48vh;
      border-radius: 5px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.24);
    }

    .image-caption {
      padding: 7px 3px 2px;
      line-height: 1.35;
      font-size: 14px;
      font-weight: 800;
    }

    .image-missing {
      padding: 9px 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .sticker-bubble {
      display: grid;
      gap: 6px;
      min-width: 148px;
      background: #fff6c7;
      color: #273746;
      justify-items: center;
    }

    .sticker-image {
      display: block;
      width: 138px;
      max-width: 44vw;
      aspect-ratio: 1;
      object-fit: contain;
    }

    .sticker-title {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.25;
    }

    .sticker-detail {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
    }

    .composer {
      position: sticky;
      bottom: 0;
      z-index: 5;
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    .composer-inner {
      width: min(760px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    textarea {
      width: 100%;
      min-height: 54px;
      max-height: 160px;
      resize: none;
      border: 2px solid #c8ccd1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 12px;
      font-size: 18px;
      line-height: 1.45;
    }

    .attachment-row {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .image-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .attach-button,
    .clear-image {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .attach-button {
      background: #d7dde4;
      color: #26313d;
      padding: 8px 12px;
    }

    .clear-image {
      background: transparent;
      color: var(--danger);
      padding: 8px 4px;
    }

    .image-preview {
      display: none;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .image-preview.active {
      display: flex;
    }

    .image-preview img {
      width: 42px;
      height: 42px;
      border-radius: 6px;
      object-fit: cover;
      background: #fff;
    }

    .group-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    select {
      width: 100%;
      min-height: 46px;
      border: 2px solid #c8ccd1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 16px;
      font-weight: 800;
    }

    select.has-unread {
      border-color: var(--unread);
      box-shadow: 0 0 0 3px rgba(216, 47, 47, 0.18);
    }

    .delete-group {
      min-width: 72px;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #d7dde4;
      color: #26313d;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .delete-group:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .send {
      min-width: 84px;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--button);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .send:hover {
      background: var(--button-dark);
    }

    @media (min-width: 760px) {
      .topbar {
        padding-inline: 22px;
      }

      h1 {
        font-size: 25px;
      }

      .chat {
        padding-top: 22px;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .status {
        grid-column: 1 / -1;
        min-height: 16px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>やんさんチャット</h1>
        <p class="current-group" id="currentGroupName">グループ読み込み中</p>
      </div>
      <button class="notify-button" id="notifyButton" type="button">通知オン</button>
      <p class="status" id="listStatus" role="status" aria-live="polite">読み込み中</p>
    </header>

    <section class="chat" id="chatLog" aria-label="メッセージ一覧">
      <div class="messages" id="messages" aria-live="polite">
        <div class="empty">メッセージを読み込んでいます。</div>
      </div>
    </section>

    <form class="composer" id="messageForm">
      <div class="composer-inner">
        <div class="group-row">
          <select id="groupSelect" aria-label="送信先グループ">
            <option value="">グループ読み込み中</option>
          </select>
          <button class="delete-group" id="deleteGroupButton" type="button" disabled>削除</button>
        </div>
        <label for="messageText">本文</label>
        <textarea id="messageText" placeholder="メッセージを入力"></textarea>
        <div class="attachment-row">
          <input class="image-input" id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/*">
          <button class="attach-button" id="attachButton" type="button">画像</button>
          <div class="image-preview" id="imagePreview" aria-live="polite">
            <img id="imagePreviewThumb" alt="">
            <span id="imagePreviewName"></span>
            <button class="clear-image" id="clearImageButton" type="button">取消</button>
          </div>
        </div>
        <button class="send" id="sendButton" type="submit">送信</button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var SENDER_NAME = "やんさん";
      var GAS_URL = "https://script.google.com/macros/s/AKfycbxHgZvRVxKg3auAV0avb2JJhVGXqUq7S21_R46Dy9R5IhoK4n1YJ6ewVVJB34ViZSs3/exec";
      var REFRESH_MS = 12000;
      var RECENT_DAYS = 5;
      var SELECTED_GROUP_KEY = "yansanSelectedGroupId";
      var DELETED_GROUPS_KEY = "yansanDeletedGroupIds";
      var GROUPS_CACHE_KEY = "yansanGroupsCache";
      var MESSAGES_CACHE_PREFIX = "yansanMessagesCache:";
      var DRAFT_PREFIX = "yansanDraft:";
      var NOTIFICATIONS_KEY = "yansanNotificationsEnabled";
      var UNREAD_COUNTS_KEY = "yansanUnreadCounts";
      var READ_TIMES_KEY = "yansanGroupReadTimes";
      var messageForm = document.getElementById("messageForm");
      var messageText = document.getElementById("messageText");
      var groupSelect = document.getElementById("groupSelect");
      var sendButton = document.getElementById("sendButton");
      var imageInput = document.getElementById("imageInput");
      var attachButton = document.getElementById("attachButton");
      var imagePreview = document.getElementById("imagePreview");
      var imagePreviewThumb = document.getElementById("imagePreviewThumb");
      var imagePreviewName = document.getElementById("imagePreviewName");
      var clearImageButton = document.getElementById("clearImageButton");
      var deleteGroupButton = document.getElementById("deleteGroupButton");
      var notifyButton = document.getElementById("notifyButton");
      var currentGroupName = document.getElementById("currentGroupName");
      var listStatus = document.getElementById("listStatus");
      var messages = document.getElementById("messages");
      var chatLog = document.getElementById("chatLog");
      var jsonpCounter = 0;
      var latestSignature = "";
      var selectedGroupId = localStorage.getItem(SELECTED_GROUP_KEY) || "";
      var pendingLocalMessages = [];
      var showOlderMessages = false;
      var liveMessageKeysByGroup = {};
      var liveLoadedGroups = {};
      var notificationsEnabled = localStorage.getItem(NOTIFICATIONS_KEY) === "1";
      var unreadCounts = readCache(UNREAD_COUNTS_KEY, {});
      var readTimes = readCache(READ_TIMES_KEY, {});
      var groupsCache = [];
      var imageDataUrlCache = {};
      var selectedImage = null;
      var serviceWorkerRegistration = null;
      var pendingTextSends = {};
      var statusHoldUntil = 0;

      messageForm.addEventListener("submit", function (event) {
        event.preventDefault();
        sendMessage();
      });

      messageText.addEventListener("input", saveCurrentDraft);

      var hasInitialGroup = bootFromCache();
      loadGroups();
      if (hasInitialGroup) {
        loadMessages();
      }
      setInterval(function () {
        if (selectedGroupId) {
          loadMessages();
        }
      }, REFRESH_MS);
      setInterval(loadGroups, 60000);
      updateAppBadge();

      groupSelect.addEventListener("change", function () {
        saveCurrentDraft();
        setSelectedGroupId(groupSelect.value);
        restoreDraftForSelectedGroup();
        markGroupRead(selectedGroupId);
        updateDeleteGroupButton();
        updateCurrentGroupName(getSelectedGroupName());
        latestSignature = "";
        showOlderMessages = false;
        messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        if (selectedGroupId) {
          loadMessages();
        }
      });

      deleteGroupButton.addEventListener("click", function () {
        deleteSelectedGroup();
      });

      attachButton.addEventListener("click", function () {
        imageInput.click();
      });

      imageInput.addEventListener("change", handleImageSelection);
      clearImageButton.addEventListener("click", clearSelectedImage);
      notifyButton.addEventListener("click", requestNotifications);
      registerServiceWorker();
      listenForServiceWorkerMessages();
      selectGroupFromLaunchUrl();
      restoreDraftForSelectedGroup();
      updateNotificationButton();

      function sendMessage() {
        var body = messageText.value.trim();
        if (!selectedGroupId) {
          showStatus("送信先グループを選択してください", "error");
          return;
        }
        if (!body && !selectedImage) {
          messageText.focus();
          return;
        }

        if (sendButton.disabled) {
          return;
        }

        if (selectedImage) {
          sendImageMessage(body, selectedImage);
          return;
        }

        var payload = {
          text: body,
          sender: SENDER_NAME,
          groupId: selectedGroupId
        };
        var sendKey = getPendingSendKey(payload.groupId, body);
        if (pendingTextSends[sendKey]) {
          showStatus("送信確認中", "");
          return;
        }
        pendingTextSends[sendKey] = true;

        sendButton.disabled = true;
        sendButton.textContent = "送信中";
        saveCurrentDraft();
        markGroupRead(selectedGroupId);
        showStatus("送信中（最大30秒）", "");

        sendTextMessage(payload, body, sendKey);
      }

      function sendTextMessage(payload, originalBody, sendKey) {
        loadJsonp({
          action: "sendMessage",
          groupId: payload.groupId,
          sender: payload.sender,
          text: payload.text
        }, function (data) {
          pendingTextSends[sendKey] = false;
          sendButton.disabled = false;
          sendButton.textContent = "送信";
          if (data && data.ok) {
            showStatus("送信しました", "", 12000);
            clearDraftIfUnchanged(payload.groupId, originalBody);
            loadMessages();
            return;
          }
          showStatus(formatSendFailure(data), "error", 30000);
          messageText.focus();
          loadMessages();
        }, function () {
          pendingTextSends[sendKey] = false;
          sendButton.disabled = false;
          sendButton.textContent = "送信";
          showStatus("送信失敗（30秒以内に確認できません。届いていなければ少し待って再送してください）", "error", 30000);
          messageText.focus();
          loadMessages();
        }, 30000);
      }

      function formatSendFailure(data, fallbackError) {
        if (data && data.error === "line_quota_exhausted") {
          var quotaValue = data.quota && data.quota.value;
          var totalUsage = data.consumption && data.consumption.totalUsage;
          var quotaDetail = quotaValue ? "（" + totalUsage + "/" + quotaValue + "）" : "";
          return "送信不可：LINEの月間送信枠を使い切っています" + quotaDetail;
        }
        if (data && data.error === "line_push_failed") {
          var detail = data.lineBody ? "：" + String(data.lineBody) : "";
          if (Number(data.lineStatus) === 429) {
            return "送信失敗（LINE 429" + detail + "）";
          }
          return "送信失敗（LINE " + (data.lineStatus || "エラー") + detail + "）";
        }
        if (data && data.error) {
          return "送信失敗（" + data.error + "）";
        }
        return fallbackError && fallbackError.message ? fallbackError.message : "送信失敗";
      }

      function getPendingSendKey(groupId, text) {
        return String(groupId || "") + "\n" + String(text || "");
      }

      function getDraftKey(groupId) {
        return DRAFT_PREFIX + String(groupId || "");
      }

      function saveCurrentDraft() {
        if (!selectedGroupId) {
          return;
        }
        try {
          var value = messageText.value;
          if (value) {
            localStorage.setItem(getDraftKey(selectedGroupId), value);
          } else {
            localStorage.removeItem(getDraftKey(selectedGroupId));
          }
        } catch (error) {}
      }

      function restoreDraftForSelectedGroup() {
        if (!selectedGroupId) {
          messageText.value = "";
          return;
        }
        try {
          messageText.value = localStorage.getItem(getDraftKey(selectedGroupId)) || "";
        } catch (error) {
          messageText.value = "";
        }
      }

      function clearDraftIfUnchanged(groupId, sentText) {
        if (selectedGroupId === groupId && messageText.value.trim() === sentText) {
          messageText.value = "";
        }
        try {
          if ((localStorage.getItem(getDraftKey(groupId)) || "").trim() === sentText) {
            localStorage.removeItem(getDraftKey(groupId));
          }
        } catch (error) {}
      }

      function sendImageMessage(caption, imageData) {
        sendButton.disabled = true;
        sendButton.textContent = "送信中";
        messageText.value = "";
        clearSelectedImage();

        var localMessage = {
          time: new Date().toISOString(),
          sender: SENDER_NAME,
          userId: "github-pages",
          groupId: selectedGroupId,
          groupName: getSelectedGroupName(),
          text: caption || "写真を送信しました",
          source: "githubPages",
          messageType: "image",
          imageUrl: imageData.dataUrl
        };
        pendingLocalMessages.push(localMessage);
        rememberMessageKeys(selectedGroupId, [localMessage]);
        markGroupRead(selectedGroupId);
        appendLocalMessage(localMessage);
        showStatus("画像送信中", "");

        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "sendImage",
            groupId: selectedGroupId,
            sender: SENDER_NAME,
            text: caption,
            fileName: imageData.fileName,
            imageDataUrl: imageData.dataUrl
          })
        }).then(function () {
          showStatus("画像を送信しました", "");
          window.setTimeout(loadMessages, 1800);
        }).catch(function () {
          showStatus("画像送信失敗", "error");
          removePendingLocalMessage(localMessage);
          messageText.value = caption;
          loadMessages();
        }).finally(function () {
          sendButton.disabled = false;
          sendButton.textContent = "送信";
        });
      }

      function handleImageSelection() {
        var file = imageInput.files && imageInput.files[0];
        if (!file) {
          clearSelectedImage();
          return;
        }
        if (!/^image\//.test(file.type)) {
          showStatus("画像ファイルを選択してください", "error");
          clearSelectedImage();
          return;
        }

        sendButton.disabled = true;
        showStatus("画像を準備中", "");
        readImageAsDataUrl(file).then(function (dataUrl) {
          return resizeImageDataUrl(dataUrl, file.name);
        }).then(function (imageData) {
          selectedImage = imageData;
          imagePreviewThumb.src = imageData.dataUrl;
          imagePreviewName.textContent = imageData.fileName;
          imagePreview.className = "image-preview active";
          showStatus("画像を選択しました", "");
        }).catch(function () {
          showStatus("画像を読み込めません", "error");
          clearSelectedImage();
        }).finally(function () {
          sendButton.disabled = false;
        });
      }

      function clearSelectedImage() {
        selectedImage = null;
        imageInput.value = "";
        imagePreviewThumb.removeAttribute("src");
        imagePreviewName.textContent = "";
        imagePreview.className = "image-preview";
      }

      function readImageAsDataUrl(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            resolve(String(reader.result || ""));
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function resizeImageDataUrl(dataUrl, fileName) {
        return new Promise(function (resolve, reject) {
          var img = new Image();
          img.onload = function () {
            var maxSide = 1280;
            var width = img.naturalWidth || img.width;
            var height = img.naturalHeight || img.height;
            var scale = Math.min(1, maxSide / Math.max(width, height));
            var canvas = document.createElement("canvas");
            canvas.width = Math.max(1, Math.round(width * scale));
            canvas.height = Math.max(1, Math.round(height * scale));
            var context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("canvas"));
              return;
            }
            context.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve({
              dataUrl: canvas.toDataURL("image/jpeg", 0.84),
              fileName: normalizeImageFileName(fileName)
            });
          };
          img.onerror = reject;
          img.src = dataUrl;
        });
      }

      function normalizeImageFileName(fileName) {
        var baseName = String(fileName || "yansan-image").replace(/\.[A-Za-z0-9]+$/, "");
        return baseName.replace(/[\\/:*?"<>|]+/g, "-") + ".jpg";
      }

      function deleteSelectedGroup() {
        var groupId = groupSelect.value;
        if (!groupId) {
          return;
        }

        var groupName = groupSelect.options[groupSelect.selectedIndex].textContent;
        if (!window.confirm(groupName + " を選択肢から削除しますか？")) {
          return;
        }

        void fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "deleteGroup",
            groupId: groupId
          })
        });

        addDeletedGroupId(groupId);
        setSelectedGroupId("");
        groupSelect.value = "";
        updateDeleteGroupButton();
        updateCurrentGroupName("");
        latestSignature = "";
        showOlderMessages = false;
        messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        showStatus("グループを削除しました", "");
        window.setTimeout(function () {
          loadGroups();
        }, 600);
      }

      function loadMessages() {
        if (!selectedGroupId) {
          messages.innerHTML = '<div class="empty">グループを選択してください。</div>';
          showStatus("グループ未選択", "");
          return;
        }

        loadJsonp({ action: "messages", groupId: selectedGroupId, limit: "50" }, function (data) {
          var rows = normalizeList(data, "messages");
          maybeNotifyNewMessages(rows);
          saveMessagesCache(selectedGroupId, rows);
          markGroupRead(selectedGroupId);
          renderMessages(rows);
          showStatusIfFree(formatCount(rows.length), "");
        }, function () {
          showStatusIfFree("読み込み失敗", "error");
        });
      }

      function loadGroups() {
        loadJsonp({ action: "groups" }, function (data) {
          var groups = normalizeList(data, "groups");
          groupsCache = groups;
          saveCache(GROUPS_CACHE_KEY, groups);
          updateUnreadGroups(groups);
          renderGroups(groups, false);
        }, function () {
          showStatus("グループ読み込み失敗", "error");
        });
      }

      function loadJsonp(params, onSuccess, onError, timeoutMs) {
        var callbackName = "__yansanMessages" + Date.now() + "_" + jsonpCounter;
        jsonpCounter += 1;

        window[callbackName] = function (data) {
          cleanupJsonp(callbackName);
          onSuccess(data);
        };

        var script = document.createElement("script");
        script.src = buildJsonpUrl(callbackName, params);
        script.async = true;
        script.dataset.jsonpCallback = callbackName;
        script.dataset.jsonpTimer = String(window.setTimeout(function () {
          cleanupJsonp(callbackName);
          onError();
        }, timeoutMs || 8000));
        script.onerror = function () {
          cleanupJsonp(callbackName);
          onError();
        };

        document.head.appendChild(script);
      }

      function normalizeList(data, key) {
        if (Array.isArray(data)) {
          return data;
        }
        if (Array.isArray(data && data[key])) {
          return data[key];
        }
        return [];
      }

      function buildJsonpUrl(callbackName, params) {
        var query = ["callback=" + encodeURIComponent(callbackName), "_=" + Date.now()];
        Object.keys(params || {}).forEach(function (key) {
          query.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
        });
        return GAS_URL + "?" + query.join("&");
      }

      function cleanupJsonp(callbackName) {
        var script = document.querySelector('script[data-jsonp-callback="' + callbackName + '"]');
        if (script && script.parentNode) {
          if (script.dataset.jsonpTimer) {
            window.clearTimeout(Number(script.dataset.jsonpTimer));
          }
          script.parentNode.removeChild(script);
        }
        try {
          window[callbackName] = function () {};
          window.setTimeout(function () {
            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] = undefined;
            }
          }, 30000);
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      function renderMessages(rows) {
        var displayRows = mergePendingMessages(rows);
        var splitRows = splitRecentRows(displayRows);
        var visibleRows = showOlderMessages ? displayRows : splitRows.recent;
        var signature = JSON.stringify(displayRows) + "|" + (showOlderMessages ? "all" : "recent");
        if (signature === latestSignature) {
          return;
        }
        latestSignature = signature;
        messages.innerHTML = "";

        if (!displayRows.length) {
          messages.innerHTML = '<div class="empty">まだメッセージはありません。</div>';
          return;
        }

        if (splitRows.older.length && !showOlderMessages && visibleRows.length) {
          appendOlderToggle(splitRows.older.length);
        }

        if (!visibleRows.length) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "最近5日以内のメッセージはありません。";
          messages.appendChild(empty);
          if (splitRows.older.length && !showOlderMessages) {
            appendOlderToggle(splitRows.older.length);
          }
        } else {
          visibleRows.forEach(appendMessageElement);
        }

        scrollToBottom();
      }

      function appendOlderToggle(count) {
        var button = document.createElement("button");
        button.className = "older-toggle";
        button.type = "button";
        button.textContent = "これより前を表示（" + count + "件）";
        button.addEventListener("click", function () {
          showOlderMessages = true;
          latestSignature = "";
          renderCachedMessages(selectedGroupId);
        });
        messages.appendChild(button);
      }

      function splitRecentRows(rows) {
        var cutoff = Date.now() - RECENT_DAYS * 24 * 60 * 60 * 1000;
        var recent = [];
        var older = [];

        rows.forEach(function (row) {
          var timestamp = getField(row, ["time", "timestamp", "datetime", "date"]);
          var time = timestamp ? new Date(timestamp).getTime() : Date.now();
          if (!Number.isNaN(time) && time < cutoff) {
            older.push(row);
          } else {
            recent.push(row);
          }
        });

        return {
          recent: recent,
          older: older
        };
      }

      function mergePendingMessages(rows) {
        var now = Date.now();
        pendingLocalMessages = pendingLocalMessages.filter(function (message) {
          return now - new Date(message.time).getTime() < 60000;
        }).filter(function (message) {
          return !rows.some(function (row) {
            return getField(row, ["text"]) === message.text
              && getField(row, ["groupId"]) === message.groupId
              && getField(row, ["sender", "senderName"]) === message.sender;
          });
        });

        return rows.concat(pendingLocalMessages.filter(function (message) {
          return message.groupId === selectedGroupId;
        }));
      }

      function appendLocalMessage(row) {
        if (messages.querySelector(".empty")) {
          messages.innerHTML = "";
        }
        latestSignature = "";
        appendMessageElement(row);
        scrollToBottom();
      }

      function removePendingLocalMessage(row) {
        pendingLocalMessages = pendingLocalMessages.filter(function (message) {
          return message !== row;
        });
        latestSignature = "";
      }

      function appendMessageElement(row) {
        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "不明";
        var text = getField(row, ["text", "body", "message"]) || "";
        var messageType = getField(row, ["messageType", "type"]) || "text";
        var imageUrl = getField(row, ["imageUrl", "image", "mediaUrl"]) || "";
        var displayImageUrl = getDisplayImageUrl(imageUrl);
        var stickerPackageId = getField(row, ["stickerPackageId", "packageId"]) || "";
        var stickerId = getField(row, ["stickerId"]) || "";
        var timestamp = getField(row, ["time", "timestamp", "datetime", "date"]);
        var isMine = senderName === SENDER_NAME || getField(row, ["source", "sourceType"]) === "githubPages";

        var item = document.createElement("article");
        item.className = "message " + (isMine ? "mine" : "other");

        var meta = document.createElement("div");
        meta.className = "message-meta";

        var name = document.createElement("span");
        name.textContent = senderName;

        var time = document.createElement("time");
        time.textContent = formatTime(timestamp);
        if (timestamp && !Number.isNaN(new Date(timestamp).getTime())) {
          time.dateTime = new Date(timestamp).toISOString();
        }

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        if (messageType === "image" && imageUrl) {
          bubble.className += " image-bubble";
          var link = document.createElement("a");
          link.href = imageUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          var image = document.createElement("img");
          image.className = "message-image";
          image.src = displayImageUrl;
          image.alt = senderName + "の写真";
          image.loading = "lazy";
          image.decoding = "async";
          image.addEventListener("error", function () {
            if (loadImageDataUrl(imageUrl, image)) {
              return;
            }
            var fallbackUrl = getDriveDownloadUrl(imageUrl);
            if (fallbackUrl && image.src !== fallbackUrl) {
              image.src = fallbackUrl;
            }
          });
          loadImageDataUrl(imageUrl, image);

          link.appendChild(image);
          bubble.appendChild(link);
          if (text && text !== "写真を送信しました" && text !== "写真が届きました") {
            var caption = document.createElement("div");
            caption.className = "image-caption";
            caption.textContent = text;
            bubble.appendChild(caption);
          }
        } else if (messageType === "image") {
          bubble.className += " image-missing";
          bubble.textContent = "写真を表示できません";
        } else if (messageType === "sticker") {
          bubble.className += " sticker-bubble";
          var stickerImageUrl = getStickerImageUrl(stickerId);
          if (stickerImageUrl) {
            var stickerImage = document.createElement("img");
            stickerImage.className = "sticker-image";
            stickerImage.src = stickerImageUrl;
            stickerImage.alt = text || "スタンプ";
            stickerImage.loading = "lazy";
            stickerImage.decoding = "async";
            bubble.appendChild(stickerImage);
          }

          var title = document.createElement("div");
          title.className = "sticker-title";
          title.textContent = text || "スタンプが届きました";

          var detail = document.createElement("div");
          detail.className = "sticker-detail";
          detail.textContent = formatStickerDetail(stickerPackageId, stickerId);

          bubble.appendChild(title);
          if (detail.textContent) {
            bubble.appendChild(detail);
          }
        } else {
          appendLinkedText(bubble, text);
        }

        meta.appendChild(name);
        meta.appendChild(time);
        item.appendChild(meta);
        item.appendChild(bubble);
        messages.appendChild(item);
      }

      function renderGroups(groups, skipReload) {
        var currentValue = selectedGroupId || localStorage.getItem(SELECTED_GROUP_KEY) || "";
        var hasCurrent = false;
        var deletedGroupIds = getDeletedGroupIds();
        var visibleGroups = groups.filter(function (group) {
          return group.groupId && deletedGroupIds.indexOf(group.groupId) === -1;
        });
        groupSelect.innerHTML = "";

        visibleGroups.forEach(function (group) {
          var option = document.createElement("option");
          option.value = group.groupId;
          option.textContent = formatGroupOptionLabel(group);
          groupSelect.appendChild(option);
          if (group.groupId === currentValue) {
            hasCurrent = true;
          }
        });

        if (!visibleGroups.length) {
          var emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = "グループがありません";
          groupSelect.appendChild(emptyOption);
          setSelectedGroupId("");
          updateCurrentGroupName("");
          messages.innerHTML = '<div class="empty">LINEグループでメッセージを受信すると、ここにグループが表示されます。</div>';
          showStatus("グループなし", "");
        } else {
          var previousGroupId = selectedGroupId;
          setSelectedGroupId(hasCurrent ? currentValue : visibleGroups[0].groupId);
          groupSelect.value = selectedGroupId;
          updateCurrentGroupName(getSelectedGroupName());
          if (selectedGroupId !== previousGroupId) {
            latestSignature = "";
            showOlderMessages = false;
            if (!skipReload) {
              renderCachedMessages(selectedGroupId);
              loadMessages();
            }
          }
        }

        updateDeleteGroupButton();
        updateUnreadUi();
      }

      function bootFromCache() {
        var cachedGroups = readCache(GROUPS_CACHE_KEY, []);
        if (cachedGroups.length) {
          groupsCache = cachedGroups;
          updateUnreadGroups(cachedGroups);
          renderGroups(cachedGroups, true);
        } else if (selectedGroupId) {
          updateCurrentGroupName("前回のグループ");
        }
        if (selectedGroupId) {
          renderCachedMessages(selectedGroupId);
          return true;
        }
        return false;
      }

      function renderCachedMessages(groupId) {
        var cachedMessages = readCache(MESSAGES_CACHE_PREFIX + groupId, []);
        if (cachedMessages.length) {
          renderMessages(cachedMessages);
        } else {
          messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        }
      }

      function saveMessagesCache(groupId, rows) {
        if (groupId) {
          saveCache(MESSAGES_CACHE_PREFIX + groupId, rows);
        }
      }

      function readCache(key, fallback) {
        try {
          var value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function saveCache(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {}
      }

      function setSelectedGroupId(groupId) {
        selectedGroupId = groupId || "";
        if (selectedGroupId) {
          localStorage.setItem(SELECTED_GROUP_KEY, selectedGroupId);
        } else {
          localStorage.removeItem(SELECTED_GROUP_KEY);
        }
      }

      function requestNotifications() {
        if (!("Notification" in window)) {
          showStatus("通知に対応していません", "error");
          updateNotificationButton();
          return;
        }

        ensureServiceWorkerReady().then(function () {
          return Notification.requestPermission();
        }).then(function (permission) {
          notificationsEnabled = permission === "granted";
          if (notificationsEnabled) {
            localStorage.setItem(NOTIFICATIONS_KEY, "1");
            showStatus("通知をオンにしました", "");
            updateAppBadge();
          } else {
            localStorage.removeItem(NOTIFICATIONS_KEY);
            showStatus("通知が許可されていません", "error");
          }
          updateNotificationButton();
        });
      }

      function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        navigator.serviceWorker.register("sw.js").then(function (registration) {
          serviceWorkerRegistration = registration;
          return navigator.serviceWorker.ready;
        }).then(function (registration) {
          serviceWorkerRegistration = registration;
        }).catch(function () {});
      }

      function listenForServiceWorkerMessages() {
        if (!("serviceWorker" in navigator)) {
          return;
        }
        navigator.serviceWorker.addEventListener("message", function (event) {
          var groupId = event.data && event.data.groupId;
          if (groupId) {
            openGroup(groupId);
          }
        });
      }

      function selectGroupFromLaunchUrl() {
        var params = new URLSearchParams(window.location.search);
        var groupId = params.get("groupId");
        if (groupId) {
          openGroup(groupId);
        }
      }

      function ensureServiceWorkerReady() {
        if (!("serviceWorker" in navigator)) {
          return Promise.resolve(null);
        }
        if (serviceWorkerRegistration) {
          return navigator.serviceWorker.ready.then(function (registration) {
            serviceWorkerRegistration = registration;
            return registration;
          });
        }
        return navigator.serviceWorker.register("sw.js").then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (registration) {
          serviceWorkerRegistration = registration;
          return registration;
        });
      }

      function updateNotificationButton() {
        if (!("Notification" in window)) {
          notifyButton.hidden = true;
          return;
        }
        if (Notification.permission === "granted" && notificationsEnabled) {
          notifyButton.textContent = "通知オン";
          notifyButton.disabled = true;
        } else if (Notification.permission === "denied") {
          notifyButton.textContent = "通知不可";
          notifyButton.disabled = true;
        } else {
          notifyButton.textContent = "通知オン";
          notifyButton.disabled = false;
        }
      }

      function maybeNotifyNewMessages(rows) {
        if (!selectedGroupId) {
          return;
        }

        var newRows = [];
        var knownKeys = liveMessageKeysByGroup[selectedGroupId];
        if (!liveLoadedGroups[selectedGroupId]) {
          rememberMessageKeys(selectedGroupId, rows);
          liveLoadedGroups[selectedGroupId] = true;
          return;
        }
        if (!knownKeys) {
          knownKeys = {};
          liveMessageKeysByGroup[selectedGroupId] = knownKeys;
        }

        rows.forEach(function (row) {
          var key = getMessageKey(row);
          if (!knownKeys[key]) {
            knownKeys[key] = true;
            if (!isOwnMessage(row)) {
              newRows.push(row);
            }
          }
        });

        if (newRows.length) {
          incrementUnread(selectedGroupId, newRows.length);
          showNewMessageNotification(newRows[newRows.length - 1], newRows.length);
        }
      }

      function updateUnreadGroups(groups) {
        var deletedGroupIds = getDeletedGroupIds();
        groups.forEach(function (group) {
          if (!group.groupId || deletedGroupIds.indexOf(group.groupId) !== -1) {
            return;
          }
          if (group.groupId === selectedGroupId) {
            return;
          }
          var lastSeenTime = parseTime(group.lastSeenAt);
          var readTime = readTimes[group.groupId] || 0;
          if (lastSeenTime && lastSeenTime > readTime) {
            fetchGroupNewMessages(group.groupId, group.groupName || group.groupId);
          }
        });
      }

      function fetchGroupNewMessages(groupId, groupName) {
        loadJsonp({ action: "messages", groupId: groupId, limit: "10" }, function (data) {
          var rows = normalizeList(data, "messages");
          var newRows = collectNewRows(groupId, rows);
          if (!newRows.length) {
            return;
          }
          saveMessagesCache(groupId, rows);
          incrementUnread(groupId, newRows.length);
          showNewMessageNotification(newRows[newRows.length - 1], newRows.length, groupId, groupName);
          renderGroups(groupsCache, true);
        }, function () {});
      }

      function collectNewRows(groupId, rows) {
        var newRows = [];
        var knownKeys = liveMessageKeysByGroup[groupId];
        if (!liveLoadedGroups[groupId]) {
          rememberMessageKeys(groupId, rows);
          liveLoadedGroups[groupId] = true;
          return [];
        }
        if (!knownKeys) {
          knownKeys = {};
          liveMessageKeysByGroup[groupId] = knownKeys;
        }
        rows.forEach(function (row) {
          var key = getMessageKey(row);
          if (!knownKeys[key]) {
            knownKeys[key] = true;
            if (!isOwnMessage(row)) {
              newRows.push(row);
            }
          }
        });
        return newRows;
      }

      function incrementUnread(groupId, count) {
        if (!groupId || groupId === selectedGroupId) {
          return;
        }
        unreadCounts[groupId] = Math.min((Number(unreadCounts[groupId]) || 0) + count, 99);
        saveCache(UNREAD_COUNTS_KEY, unreadCounts);
        updateUnreadUi();
        updateAppBadge();
      }

      function markGroupRead(groupId) {
        if (!groupId) {
          return;
        }
        unreadCounts[groupId] = 0;
        readTimes[groupId] = Date.now();
        saveCache(UNREAD_COUNTS_KEY, unreadCounts);
        saveCache(READ_TIMES_KEY, readTimes);
        updateUnreadUi();
        updateAppBadge();
      }

      function updateUnreadUi() {
        var total = getTotalUnread();
        groupSelect.className = total ? "has-unread" : "";
        if (currentGroupName) {
          currentGroupName.className = "current-group" + (total ? " has-unread" : "");
        }
      }

      function updateAppBadge() {
        var total = getTotalUnread();
        if ("setAppBadge" in navigator) {
          if (total > 0) {
            navigator.setAppBadge(total).catch(function () {});
          } else if ("clearAppBadge" in navigator) {
            navigator.clearAppBadge().catch(function () {});
          }
        }
      }

      function getTotalUnread() {
        return Object.keys(unreadCounts).reduce(function (total, groupId) {
          return total + (Number(unreadCounts[groupId]) || 0);
        }, 0);
      }

      function formatGroupOptionLabel(group) {
        var name = group.groupName || group.groupId;
        var unread = Number(unreadCounts[group.groupId]) || 0;
        return unread ? "● " + name + "（" + unread + "）" : name;
      }

      function getNotificationBody(row) {
        var messageType = getField(row, ["messageType", "type"]);
        if (messageType === "image") {
          return "写真が届きました";
        }
        if (messageType === "sticker") {
          return "スタンプが届きました";
        }
        return "";
      }

      function formatStickerDetail(packageId, stickerId) {
        var parts = [];
        if (packageId) {
          parts.push("package " + packageId);
        }
        if (stickerId) {
          parts.push("sticker " + stickerId);
        }
        return parts.join(" / ");
      }

      function getStickerImageUrl(stickerId) {
        if (!stickerId || !/^\d+$/.test(String(stickerId))) {
          return "";
        }
        return "https://stickershop.line-scdn.net/stickershop/v1/sticker/" + encodeURIComponent(stickerId) + "/iPhone/sticker.png";
      }

      function appendLinkedText(container, text) {
        var value = String(text || "");
        var urlPattern = /((?:https?:\/\/|www\.)[^\s<>"']+)/gi;
        var lastIndex = 0;
        var match;

        while ((match = urlPattern.exec(value)) !== null) {
          var rawUrl = match[0];
          var cleanUrl = rawUrl.replace(/[.,!?;:、。！？)）\]}」』]+$/g, "");
          var trailingText = rawUrl.slice(cleanUrl.length);

          if (match.index > lastIndex) {
            container.appendChild(document.createTextNode(value.slice(lastIndex, match.index)));
          }

          if (cleanUrl) {
            var link = document.createElement("a");
            link.href = /^https?:\/\//i.test(cleanUrl) ? cleanUrl : "https://" + cleanUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = cleanUrl;
            container.appendChild(link);
          }

          if (trailingText) {
            container.appendChild(document.createTextNode(trailingText));
          }

          lastIndex = match.index + rawUrl.length;
        }

        if (lastIndex < value.length) {
          container.appendChild(document.createTextNode(value.slice(lastIndex)));
        }
      }

      function loadImageDataUrl(imageUrl, image) {
        if (!imageUrl || image.dataset.imageDataRequested === "1") {
          return false;
        }

        if (imageDataUrlCache[imageUrl]) {
          image.src = imageDataUrlCache[imageUrl];
          return true;
        }

        if (!shouldProxyImageUrl(imageUrl)) {
          return false;
        }

        image.dataset.imageDataRequested = "1";
        loadJsonp({
          action: "imageData",
          imageUrl: imageUrl
        }, function (data) {
          if (data && data.ok && data.imageDataUrl) {
            imageDataUrlCache[imageUrl] = data.imageDataUrl;
            image.src = data.imageDataUrl;
          }
        }, function () {}, 20000);
        return true;
      }

      function shouldProxyImageUrl(url) {
        var driveId = getDriveFileId(url);
        return Boolean(driveId);
      }

      function getDisplayImageUrl(url) {
        var driveId = getDriveFileId(url);
        if (!driveId) {
          return url;
        }
        return "https://drive.google.com/thumbnail?sz=w1200&id=" + encodeURIComponent(driveId) + getDriveResourceKeyQuery(url);
      }

      function getDriveDownloadUrl(url) {
        var driveId = getDriveFileId(url);
        if (!driveId) {
          return "";
        }
        return "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(driveId) + getDriveResourceKeyQuery(url);
      }

      function getDriveFileId(url) {
        try {
          var parsed = new URL(url, window.location.href);
          if (parsed.hostname !== "drive.google.com" && parsed.hostname !== "www.drive.google.com") {
            return "";
          }
          var id = parsed.searchParams.get("id");
          if (id) {
            return id;
          }
          var match = parsed.pathname.match(/\/file\/d\/([^/]+)/);
          return match ? match[1] : "";
        } catch (error) {
          return "";
        }
      }

      function getDriveResourceKeyQuery(url) {
        try {
          var parsed = new URL(url, window.location.href);
          var resourceKey = parsed.searchParams.get("resourcekey");
          return resourceKey ? "&resourcekey=" + encodeURIComponent(resourceKey) : "";
        } catch (error) {
          return "";
        }
      }

      function rememberMessageKeys(groupId, rows) {
        if (!groupId) {
          return;
        }
        var keys = liveMessageKeysByGroup[groupId] || {};
        rows.forEach(function (row) {
          keys[getMessageKey(row)] = true;
        });
        liveMessageKeysByGroup[groupId] = keys;
      }

      function getMessageKey(row) {
        return [
          getField(row, ["time", "timestamp", "datetime", "date"]),
          getField(row, ["sender", "senderName", "name", "userName"]),
          getField(row, ["groupId"]),
          getField(row, ["text", "body", "message"]),
          getField(row, ["messageType", "type"]),
          getField(row, ["imageUrl", "image", "mediaUrl"]),
          getField(row, ["stickerPackageId", "packageId"]),
          getField(row, ["stickerId"])
        ].join("|");
      }

      function isOwnMessage(row) {
        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "";
        return senderName === SENDER_NAME || getField(row, ["source", "sourceType"]) === "githubPages";
      }

      function showNewMessageNotification(row, count, groupId, groupName) {
        if (!notificationsEnabled || !("Notification" in window) || Notification.permission !== "granted") {
          return;
        }

        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "新着";
        var text = getField(row, ["text", "body", "message"])
          || getNotificationBody(row);
        var titlePrefix = groupName ? groupName + " / " : "";
        var title = count > 1 ? titlePrefix + "新しいメッセージ " + count + "件" : titlePrefix + senderName + "から新着";
        var options = {
          body: text,
          icon: "assets/icon-192.png",
          badge: "assets/icon-192.png",
          tag: "yansan-chat-" + (groupId || selectedGroupId),
          renotify: true,
          data: {
            url: "./?groupId=" + encodeURIComponent(groupId || selectedGroupId),
            groupId: groupId || selectedGroupId
          }
        };

        if ("serviceWorker" in navigator) {
          ensureServiceWorkerReady().then(function (registration) {
            if (registration && registration.showNotification) {
              registration.showNotification(title, options).catch(function () {});
            }
          }).catch(function () {});
          return;
        }

        try {
          var notification = new Notification(title, options);
          notification.onclick = function () {
            window.focus();
            notification.close();
          };
        } catch (error) {}
      }

      function updateDeleteGroupButton() {
        deleteGroupButton.disabled = !groupSelect.value;
      }

      function openGroup(groupId) {
        saveCurrentDraft();
        setSelectedGroupId(groupId);
        groupSelect.value = groupId;
        restoreDraftForSelectedGroup();
        markGroupRead(groupId);
        updateDeleteGroupButton();
        updateCurrentGroupName(getSelectedGroupName());
        latestSignature = "";
        showOlderMessages = false;
        renderCachedMessages(groupId);
        loadMessages();
      }

      function updateCurrentGroupName(name) {
        currentGroupName.textContent = name || "グループ未選択";
      }

      function getSelectedGroupName() {
        if (!groupSelect.value || groupSelect.selectedIndex < 0) {
          return "";
        }
        var group = findGroupById(groupSelect.value);
        return group ? group.groupName || group.groupId : groupSelect.options[groupSelect.selectedIndex].textContent;
      }

      function findGroupById(groupId) {
        for (var i = 0; i < groupsCache.length; i += 1) {
          if (groupsCache[i].groupId === groupId) {
            return groupsCache[i];
          }
        }
        return null;
      }

      function getDeletedGroupIds() {
        try {
          var value = localStorage.getItem(DELETED_GROUPS_KEY);
          var parsed = value ? JSON.parse(value) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function addDeletedGroupId(groupId) {
        var ids = getDeletedGroupIds();
        if (ids.indexOf(groupId) === -1) {
          ids.push(groupId);
          localStorage.setItem(DELETED_GROUPS_KEY, JSON.stringify(ids));
        }
      }

      function parseTime(value) {
        var time = value ? new Date(value).getTime() : 0;
        return Number.isNaN(time) ? 0 : time;
      }

      function scrollToBottom() {
        function move() {
          chatLog.scrollTop = chatLog.scrollHeight;
          window.scrollTo(0, document.documentElement.scrollHeight);
        }
        window.requestAnimationFrame(function () {
          move();
          window.setTimeout(function () {
            move();
          }, 60);
        });
      }

      function showStatus(message, type, holdMs) {
        listStatus.textContent = message;
        listStatus.className = "status" + (type ? " " + type : "");
        statusHoldUntil = holdMs ? Date.now() + holdMs : 0;
      }

      function showStatusIfFree(message, type) {
        if (Date.now() < statusHoldUntil) {
          return;
        }
        showStatus(message, type);
      }

      function formatCount(count) {
        if (!count) {
          return "0件";
        }
        return count + "件";
      }

      function getField(row, keys) {
        for (var i = 0; i < keys.length; i += 1) {
          if (row && row[keys[i]] !== undefined && row[keys[i]] !== null) {
            return String(row[keys[i]]);
          }
        }
        return "";
      }

      function formatTime(value) {
        if (!value) {
          return "";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return new Intl.DateTimeFormat("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }
    }());
  </script>
</body>
</html>
