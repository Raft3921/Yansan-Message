<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6f9cc7">
  <title>やんさんチャット</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #8bb4d9;
      --header: #6f9cc7;
      --chat: #8bb4d9;
      --mine: #8de055;
      --other: #ffffff;
      --ink: #17202a;
      --muted: #5c6670;
      --line: rgba(34, 48, 62, 0.18);
      --panel: #f7f8fa;
      --button: #0b7a4b;
      --button-dark: #075f3a;
      --danger: #a42d18;
      --secondary: #2f6f9f;
      --unread: #d82f2f;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--chat);
      color: var(--ink);
      line-height: 1.5;
    }

    button,
    textarea {
      font: inherit;
    }

    button:focus-visible,
    textarea:focus-visible {
      outline: 4px solid rgba(255, 255, 255, 0.7);
      outline-offset: 2px;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--chat);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      min-height: 64px;
      padding: 10px 14px;
      background: var(--header);
      color: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }

    .title-block {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .current-group {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.92);
      font-size: 13px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-group.has-unread {
      color: #fff8d8;
    }

    .status {
      min-height: 22px;
      margin: 0;
      color: rgba(255, 255, 255, 0.9);
      font-size: 13px;
      font-weight: 700;
      text-align: right;
    }

    .status.error {
      color: #ffe1d9;
    }

    .notify-button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 900;
      padding: 8px 10px;
      touch-action: manipulation;
      white-space: nowrap;
    }

    .notify-button:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .chat {
      min-height: 0;
      overflow-y: auto;
      padding: 14px 12px 18px;
      scroll-behavior: smooth;
    }

    .messages {
      width: min(760px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 10px;
    }

    .empty {
      width: min(560px, 100%);
      margin: 28px auto;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.58);
      color: #273746;
      text-align: center;
      font-weight: 800;
    }

    .older-toggle {
      justify-self: center;
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      background: var(--secondary);
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      padding: 10px 16px;
      touch-action: manipulation;
    }

    .message {
      display: grid;
      max-width: 82%;
      gap: 4px;
    }

    .message.other {
      justify-self: start;
    }

    .message.mine {
      justify-self: end;
    }

    .message-meta {
      display: flex;
      gap: 8px;
      align-items: baseline;
      padding: 0 6px;
      color: rgba(23, 32, 42, 0.74);
      font-size: 12px;
      font-weight: 800;
    }

    .message.mine .message-meta {
      justify-content: flex-end;
    }

    .bubble {
      position: relative;
      width: fit-content;
      max-width: 100%;
      padding: 10px 13px;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
      line-height: 1.55;
    }

    .message.other .bubble {
      background: var(--other);
      border-top-left-radius: 3px;
    }

    .message.mine .bubble {
      justify-self: end;
      background: var(--mine);
      border-top-right-radius: 3px;
    }

    .bubble.image-bubble {
      padding: 5px;
      line-height: 0;
    }

    .message-image {
      display: block;
      width: min(68vw, 300px);
      max-width: 100%;
      max-height: 48vh;
      border-radius: 5px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.24);
    }

    .image-missing {
      padding: 9px 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .composer {
      position: sticky;
      bottom: 0;
      z-index: 5;
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 10px;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    .composer-inner {
      width: min(760px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }

    label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    textarea {
      width: 100%;
      min-height: 54px;
      max-height: 160px;
      resize: none;
      border: 2px solid #c8ccd1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 12px;
      font-size: 18px;
      line-height: 1.45;
    }

    .group-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }

    select {
      width: 100%;
      min-height: 46px;
      border: 2px solid #c8ccd1;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 8px 10px;
      font-size: 16px;
      font-weight: 800;
    }

    select.has-unread {
      border-color: var(--unread);
      box-shadow: 0 0 0 3px rgba(216, 47, 47, 0.18);
    }

    .delete-group {
      min-width: 72px;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #d7dde4;
      color: #26313d;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .delete-group:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .send {
      min-width: 84px;
      min-height: 54px;
      border: 0;
      border-radius: 8px;
      background: var(--button);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 900;
      touch-action: manipulation;
    }

    .send:hover {
      background: var(--button-dark);
    }

    @media (min-width: 760px) {
      .topbar {
        padding-inline: 22px;
      }

      h1 {
        font-size: 25px;
      }

      .chat {
        padding-top: 22px;
      }
    }

    @media (max-width: 430px) {
      .topbar {
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .status {
        grid-column: 1 / -1;
        min-height: 16px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <h1>やんさんチャット</h1>
        <p class="current-group" id="currentGroupName">グループ読み込み中</p>
      </div>
      <button class="notify-button" id="notifyButton" type="button">通知オン</button>
      <p class="status" id="listStatus" role="status" aria-live="polite">読み込み中</p>
    </header>

    <section class="chat" id="chatLog" aria-label="メッセージ一覧">
      <div class="messages" id="messages" aria-live="polite">
        <div class="empty">メッセージを読み込んでいます。</div>
      </div>
    </section>

    <form class="composer" id="messageForm">
      <div class="composer-inner">
        <div class="group-row">
          <select id="groupSelect" aria-label="送信先グループ">
            <option value="">グループ読み込み中</option>
          </select>
          <button class="delete-group" id="deleteGroupButton" type="button" disabled>削除</button>
        </div>
        <label for="messageText">本文</label>
        <textarea id="messageText" required placeholder="メッセージを入力"></textarea>
        <button class="send" id="sendButton" type="submit">送信</button>
      </div>
    </form>
  </main>

  <script>
    (function () {
      "use strict";

      var SENDER_NAME = "やんさん";
      var GAS_URL = "https://script.google.com/macros/s/AKfycbwFI1JIj6WL2I2p1Fto8BBjpv5w4SQAiixaesjsiUIXx-RXoirQM3HOeeJ1FW38RwkA_w/exec";
      var REFRESH_MS = 12000;
      var RECENT_DAYS = 5;
      var SELECTED_GROUP_KEY = "yansanSelectedGroupId";
      var DELETED_GROUPS_KEY = "yansanDeletedGroupIds";
      var GROUPS_CACHE_KEY = "yansanGroupsCache";
      var MESSAGES_CACHE_PREFIX = "yansanMessagesCache:";
      var NOTIFICATIONS_KEY = "yansanNotificationsEnabled";
      var UNREAD_COUNTS_KEY = "yansanUnreadCounts";
      var READ_TIMES_KEY = "yansanGroupReadTimes";
      var messageForm = document.getElementById("messageForm");
      var messageText = document.getElementById("messageText");
      var groupSelect = document.getElementById("groupSelect");
      var deleteGroupButton = document.getElementById("deleteGroupButton");
      var notifyButton = document.getElementById("notifyButton");
      var currentGroupName = document.getElementById("currentGroupName");
      var listStatus = document.getElementById("listStatus");
      var messages = document.getElementById("messages");
      var chatLog = document.getElementById("chatLog");
      var jsonpCounter = 0;
      var latestSignature = "";
      var selectedGroupId = localStorage.getItem(SELECTED_GROUP_KEY) || "";
      var pendingLocalMessages = [];
      var showOlderMessages = false;
      var liveMessageKeysByGroup = {};
      var liveLoadedGroups = {};
      var notificationsEnabled = localStorage.getItem(NOTIFICATIONS_KEY) === "1";
      var unreadCounts = readCache(UNREAD_COUNTS_KEY, {});
      var readTimes = readCache(READ_TIMES_KEY, {});
      var groupsCache = [];
      var serviceWorkerRegistration = null;

      messageForm.addEventListener("submit", function (event) {
        event.preventDefault();
        sendMessage();
      });

      messageText.addEventListener("keydown", function (event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      var hasInitialGroup = bootFromCache();
      loadGroups();
      if (hasInitialGroup) {
        loadMessages();
      }
      setInterval(function () {
        if (selectedGroupId) {
          loadMessages();
        }
      }, REFRESH_MS);
      setInterval(loadGroups, 60000);
      updateAppBadge();

      groupSelect.addEventListener("change", function () {
        setSelectedGroupId(groupSelect.value);
        markGroupRead(selectedGroupId);
        updateDeleteGroupButton();
        updateCurrentGroupName(getSelectedGroupName());
        latestSignature = "";
        showOlderMessages = false;
        messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        if (selectedGroupId) {
          loadMessages();
        }
      });

      deleteGroupButton.addEventListener("click", function () {
        deleteSelectedGroup();
      });

      notifyButton.addEventListener("click", requestNotifications);
      registerServiceWorker();
      listenForServiceWorkerMessages();
      selectGroupFromLaunchUrl();
      updateNotificationButton();

      function sendMessage() {
        var body = messageText.value.trim();
        if (!selectedGroupId) {
          showStatus("送信先グループを選択してください", "error");
          return;
        }
        if (!body) {
          messageText.focus();
          return;
        }

        var payload = {
          text: body,
          sender: SENDER_NAME,
          groupId: selectedGroupId
        };

        messageText.value = "";
        var localMessage = {
          time: new Date().toISOString(),
          sender: SENDER_NAME,
          userId: "github-pages",
          groupId: selectedGroupId,
          groupName: getSelectedGroupName(),
          text: body,
          source: "githubPages"
        };
        pendingLocalMessages.push(localMessage);
        rememberMessageKeys(selectedGroupId, [localMessage]);
        markGroupRead(selectedGroupId);
        appendLocalMessage(localMessage);
        showStatus("送信しました", "");

        void fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify(payload)
        });

        window.setTimeout(loadMessages, 900);
      }

      function deleteSelectedGroup() {
        var groupId = groupSelect.value;
        if (!groupId) {
          return;
        }

        var groupName = groupSelect.options[groupSelect.selectedIndex].textContent;
        if (!window.confirm(groupName + " を選択肢から削除しますか？")) {
          return;
        }

        void fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            action: "deleteGroup",
            groupId: groupId
          })
        });

        addDeletedGroupId(groupId);
        setSelectedGroupId("");
        groupSelect.value = "";
        updateDeleteGroupButton();
        updateCurrentGroupName("");
        latestSignature = "";
        showOlderMessages = false;
        messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        showStatus("グループを削除しました", "");
        window.setTimeout(function () {
          loadGroups();
        }, 600);
      }

      function loadMessages() {
        if (!selectedGroupId) {
          messages.innerHTML = '<div class="empty">グループを選択してください。</div>';
          showStatus("グループ未選択", "");
          return;
        }

        loadJsonp({ action: "messages", groupId: selectedGroupId, limit: "50" }, function (data) {
          var rows = normalizeList(data, "messages");
          maybeNotifyNewMessages(rows);
          saveMessagesCache(selectedGroupId, rows);
          markGroupRead(selectedGroupId);
          renderMessages(rows);
          showStatus(formatCount(rows.length), "");
        }, function () {
          showStatus("読み込み失敗", "error");
        });
      }

      function loadGroups() {
        loadJsonp({ action: "groups" }, function (data) {
          var groups = normalizeList(data, "groups");
          groupsCache = groups;
          saveCache(GROUPS_CACHE_KEY, groups);
          updateUnreadGroups(groups);
          renderGroups(groups, false);
        }, function () {
          showStatus("グループ読み込み失敗", "error");
        });
      }

      function loadJsonp(params, onSuccess, onError) {
        var callbackName = "__yansanMessages" + Date.now() + "_" + jsonpCounter;
        jsonpCounter += 1;

        window[callbackName] = function (data) {
          cleanupJsonp(callbackName);
          onSuccess(data);
        };

        var script = document.createElement("script");
        script.src = buildJsonpUrl(callbackName, params);
        script.async = true;
        script.dataset.jsonpCallback = callbackName;
        script.dataset.jsonpTimer = String(window.setTimeout(function () {
          cleanupJsonp(callbackName);
          onError();
        }, 8000));
        script.onerror = function () {
          cleanupJsonp(callbackName);
          onError();
        };

        document.head.appendChild(script);
      }

      function normalizeList(data, key) {
        if (Array.isArray(data)) {
          return data;
        }
        if (Array.isArray(data && data[key])) {
          return data[key];
        }
        return [];
      }

      function buildJsonpUrl(callbackName, params) {
        var query = ["callback=" + encodeURIComponent(callbackName), "_=" + Date.now()];
        Object.keys(params || {}).forEach(function (key) {
          query.push(encodeURIComponent(key) + "=" + encodeURIComponent(params[key]));
        });
        return GAS_URL + "?" + query.join("&");
      }

      function cleanupJsonp(callbackName) {
        var script = document.querySelector('script[data-jsonp-callback="' + callbackName + '"]');
        if (script && script.parentNode) {
          if (script.dataset.jsonpTimer) {
            window.clearTimeout(Number(script.dataset.jsonpTimer));
          }
          script.parentNode.removeChild(script);
        }
        try {
          window[callbackName] = function () {};
          window.setTimeout(function () {
            try {
              delete window[callbackName];
            } catch (error) {
              window[callbackName] = undefined;
            }
          }, 30000);
        } catch (error) {
          window[callbackName] = undefined;
        }
      }

      function renderMessages(rows) {
        var displayRows = mergePendingMessages(rows);
        var splitRows = splitRecentRows(displayRows);
        var visibleRows = showOlderMessages ? displayRows : splitRows.recent;
        var signature = JSON.stringify(displayRows) + "|" + (showOlderMessages ? "all" : "recent");
        if (signature === latestSignature) {
          return;
        }
        latestSignature = signature;
        messages.innerHTML = "";

        if (!displayRows.length) {
          messages.innerHTML = '<div class="empty">まだメッセージはありません。</div>';
          return;
        }

        if (splitRows.older.length && !showOlderMessages && visibleRows.length) {
          appendOlderToggle(splitRows.older.length);
        }

        if (!visibleRows.length) {
          var empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "最近5日以内のメッセージはありません。";
          messages.appendChild(empty);
          if (splitRows.older.length && !showOlderMessages) {
            appendOlderToggle(splitRows.older.length);
          }
        } else {
          visibleRows.forEach(appendMessageElement);
        }

        scrollToBottom();
      }

      function appendOlderToggle(count) {
        var button = document.createElement("button");
        button.className = "older-toggle";
        button.type = "button";
        button.textContent = "これより前を表示（" + count + "件）";
        button.addEventListener("click", function () {
          showOlderMessages = true;
          latestSignature = "";
          renderCachedMessages(selectedGroupId);
        });
        messages.appendChild(button);
      }

      function splitRecentRows(rows) {
        var cutoff = Date.now() - RECENT_DAYS * 24 * 60 * 60 * 1000;
        var recent = [];
        var older = [];

        rows.forEach(function (row) {
          var timestamp = getField(row, ["time", "timestamp", "datetime", "date"]);
          var time = timestamp ? new Date(timestamp).getTime() : Date.now();
          if (!Number.isNaN(time) && time < cutoff) {
            older.push(row);
          } else {
            recent.push(row);
          }
        });

        return {
          recent: recent,
          older: older
        };
      }

      function mergePendingMessages(rows) {
        var now = Date.now();
        pendingLocalMessages = pendingLocalMessages.filter(function (message) {
          return now - new Date(message.time).getTime() < 60000;
        }).filter(function (message) {
          return !rows.some(function (row) {
            return getField(row, ["text"]) === message.text
              && getField(row, ["groupId"]) === message.groupId
              && getField(row, ["sender", "senderName"]) === message.sender;
          });
        });

        return rows.concat(pendingLocalMessages.filter(function (message) {
          return message.groupId === selectedGroupId;
        }));
      }

      function appendLocalMessage(row) {
        if (messages.querySelector(".empty")) {
          messages.innerHTML = "";
        }
        latestSignature = "";
        appendMessageElement(row);
        scrollToBottom();
      }

      function appendMessageElement(row) {
        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "不明";
        var text = getField(row, ["text", "body", "message"]) || "";
        var messageType = getField(row, ["messageType", "type"]) || "text";
        var imageUrl = getField(row, ["imageUrl", "image", "mediaUrl"]) || "";
        var timestamp = getField(row, ["time", "timestamp", "datetime", "date"]);
        var isMine = senderName === SENDER_NAME || getField(row, ["source", "sourceType"]) === "githubPages";

        var item = document.createElement("article");
        item.className = "message " + (isMine ? "mine" : "other");

        var meta = document.createElement("div");
        meta.className = "message-meta";

        var name = document.createElement("span");
        name.textContent = senderName;

        var time = document.createElement("time");
        time.textContent = formatTime(timestamp);
        if (timestamp && !Number.isNaN(new Date(timestamp).getTime())) {
          time.dateTime = new Date(timestamp).toISOString();
        }

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        if (messageType === "image" && imageUrl) {
          bubble.className += " image-bubble";
          var link = document.createElement("a");
          link.href = imageUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";

          var image = document.createElement("img");
          image.className = "message-image";
          image.src = imageUrl;
          image.alt = senderName + "の写真";
          image.loading = "lazy";
          image.decoding = "async";

          link.appendChild(image);
          bubble.appendChild(link);
        } else if (messageType === "image") {
          bubble.className += " image-missing";
          bubble.textContent = "写真を表示できません";
        } else {
          bubble.textContent = text;
        }

        meta.appendChild(name);
        meta.appendChild(time);
        item.appendChild(meta);
        item.appendChild(bubble);
        messages.appendChild(item);
      }

      function renderGroups(groups, skipReload) {
        var currentValue = selectedGroupId || localStorage.getItem(SELECTED_GROUP_KEY) || "";
        var hasCurrent = false;
        var deletedGroupIds = getDeletedGroupIds();
        var visibleGroups = groups.filter(function (group) {
          return group.groupId && deletedGroupIds.indexOf(group.groupId) === -1;
        });
        groupSelect.innerHTML = "";

        visibleGroups.forEach(function (group) {
          var option = document.createElement("option");
          option.value = group.groupId;
          option.textContent = formatGroupOptionLabel(group);
          groupSelect.appendChild(option);
          if (group.groupId === currentValue) {
            hasCurrent = true;
          }
        });

        if (!visibleGroups.length) {
          var emptyOption = document.createElement("option");
          emptyOption.value = "";
          emptyOption.textContent = "グループがありません";
          groupSelect.appendChild(emptyOption);
          setSelectedGroupId("");
          updateCurrentGroupName("");
          messages.innerHTML = '<div class="empty">LINEグループでメッセージを受信すると、ここにグループが表示されます。</div>';
          showStatus("グループなし", "");
        } else {
          var previousGroupId = selectedGroupId;
          setSelectedGroupId(hasCurrent ? currentValue : visibleGroups[0].groupId);
          groupSelect.value = selectedGroupId;
          updateCurrentGroupName(getSelectedGroupName());
          if (selectedGroupId !== previousGroupId) {
            latestSignature = "";
            showOlderMessages = false;
            if (!skipReload) {
              renderCachedMessages(selectedGroupId);
              loadMessages();
            }
          }
        }

        updateDeleteGroupButton();
        updateUnreadUi();
      }

      function bootFromCache() {
        var cachedGroups = readCache(GROUPS_CACHE_KEY, []);
        if (cachedGroups.length) {
          groupsCache = cachedGroups;
          updateUnreadGroups(cachedGroups);
          renderGroups(cachedGroups, true);
        } else if (selectedGroupId) {
          updateCurrentGroupName("前回のグループ");
        }
        if (selectedGroupId) {
          renderCachedMessages(selectedGroupId);
          return true;
        }
        return false;
      }

      function renderCachedMessages(groupId) {
        var cachedMessages = readCache(MESSAGES_CACHE_PREFIX + groupId, []);
        if (cachedMessages.length) {
          renderMessages(cachedMessages);
        } else {
          messages.innerHTML = '<div class="empty">メッセージを読み込んでいます。</div>';
        }
      }

      function saveMessagesCache(groupId, rows) {
        if (groupId) {
          saveCache(MESSAGES_CACHE_PREFIX + groupId, rows);
        }
      }

      function readCache(key, fallback) {
        try {
          var value = localStorage.getItem(key);
          return value ? JSON.parse(value) : fallback;
        } catch (error) {
          return fallback;
        }
      }

      function saveCache(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (error) {}
      }

      function setSelectedGroupId(groupId) {
        selectedGroupId = groupId || "";
        if (selectedGroupId) {
          localStorage.setItem(SELECTED_GROUP_KEY, selectedGroupId);
        } else {
          localStorage.removeItem(SELECTED_GROUP_KEY);
        }
      }

      function requestNotifications() {
        if (!("Notification" in window)) {
          showStatus("通知に対応していません", "error");
          updateNotificationButton();
          return;
        }

        ensureServiceWorkerReady().then(function () {
          return Notification.requestPermission();
        }).then(function (permission) {
          notificationsEnabled = permission === "granted";
          if (notificationsEnabled) {
            localStorage.setItem(NOTIFICATIONS_KEY, "1");
            showStatus("通知をオンにしました", "");
            updateAppBadge();
          } else {
            localStorage.removeItem(NOTIFICATIONS_KEY);
            showStatus("通知が許可されていません", "error");
          }
          updateNotificationButton();
        });
      }

      function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) {
          return;
        }

        navigator.serviceWorker.register("sw.js").then(function (registration) {
          serviceWorkerRegistration = registration;
          return navigator.serviceWorker.ready;
        }).then(function (registration) {
          serviceWorkerRegistration = registration;
        }).catch(function () {});
      }

      function listenForServiceWorkerMessages() {
        if (!("serviceWorker" in navigator)) {
          return;
        }
        navigator.serviceWorker.addEventListener("message", function (event) {
          var groupId = event.data && event.data.groupId;
          if (groupId) {
            openGroup(groupId);
          }
        });
      }

      function selectGroupFromLaunchUrl() {
        var params = new URLSearchParams(window.location.search);
        var groupId = params.get("groupId");
        if (groupId) {
          openGroup(groupId);
        }
      }

      function ensureServiceWorkerReady() {
        if (!("serviceWorker" in navigator)) {
          return Promise.resolve(null);
        }
        if (serviceWorkerRegistration) {
          return navigator.serviceWorker.ready.then(function (registration) {
            serviceWorkerRegistration = registration;
            return registration;
          });
        }
        return navigator.serviceWorker.register("sw.js").then(function () {
          return navigator.serviceWorker.ready;
        }).then(function (registration) {
          serviceWorkerRegistration = registration;
          return registration;
        });
      }

      function updateNotificationButton() {
        if (!("Notification" in window)) {
          notifyButton.hidden = true;
          return;
        }
        if (Notification.permission === "granted" && notificationsEnabled) {
          notifyButton.textContent = "通知オン";
          notifyButton.disabled = true;
        } else if (Notification.permission === "denied") {
          notifyButton.textContent = "通知不可";
          notifyButton.disabled = true;
        } else {
          notifyButton.textContent = "通知オン";
          notifyButton.disabled = false;
        }
      }

      function maybeNotifyNewMessages(rows) {
        if (!selectedGroupId) {
          return;
        }

        var newRows = [];
        var knownKeys = liveMessageKeysByGroup[selectedGroupId];
        if (!liveLoadedGroups[selectedGroupId]) {
          rememberMessageKeys(selectedGroupId, rows);
          liveLoadedGroups[selectedGroupId] = true;
          return;
        }
        if (!knownKeys) {
          knownKeys = {};
          liveMessageKeysByGroup[selectedGroupId] = knownKeys;
        }

        rows.forEach(function (row) {
          var key = getMessageKey(row);
          if (!knownKeys[key]) {
            knownKeys[key] = true;
            if (!isOwnMessage(row)) {
              newRows.push(row);
            }
          }
        });

        if (newRows.length) {
          incrementUnread(selectedGroupId, newRows.length);
          showNewMessageNotification(newRows[newRows.length - 1], newRows.length);
        }
      }

      function updateUnreadGroups(groups) {
        var deletedGroupIds = getDeletedGroupIds();
        groups.forEach(function (group) {
          if (!group.groupId || deletedGroupIds.indexOf(group.groupId) !== -1) {
            return;
          }
          if (group.groupId === selectedGroupId) {
            return;
          }
          var lastSeenTime = parseTime(group.lastSeenAt);
          var readTime = readTimes[group.groupId] || 0;
          if (lastSeenTime && lastSeenTime > readTime) {
            fetchGroupNewMessages(group.groupId, group.groupName || group.groupId);
          }
        });
      }

      function fetchGroupNewMessages(groupId, groupName) {
        loadJsonp({ action: "messages", groupId: groupId, limit: "10" }, function (data) {
          var rows = normalizeList(data, "messages");
          var newRows = collectNewRows(groupId, rows);
          if (!newRows.length) {
            return;
          }
          saveMessagesCache(groupId, rows);
          incrementUnread(groupId, newRows.length);
          showNewMessageNotification(newRows[newRows.length - 1], newRows.length, groupId, groupName);
          renderGroups(groupsCache, true);
        }, function () {});
      }

      function collectNewRows(groupId, rows) {
        var newRows = [];
        var knownKeys = liveMessageKeysByGroup[groupId];
        if (!liveLoadedGroups[groupId]) {
          rememberMessageKeys(groupId, rows);
          liveLoadedGroups[groupId] = true;
          return [];
        }
        if (!knownKeys) {
          knownKeys = {};
          liveMessageKeysByGroup[groupId] = knownKeys;
        }
        rows.forEach(function (row) {
          var key = getMessageKey(row);
          if (!knownKeys[key]) {
            knownKeys[key] = true;
            if (!isOwnMessage(row)) {
              newRows.push(row);
            }
          }
        });
        return newRows;
      }

      function incrementUnread(groupId, count) {
        if (!groupId || groupId === selectedGroupId) {
          return;
        }
        unreadCounts[groupId] = Math.min((Number(unreadCounts[groupId]) || 0) + count, 99);
        saveCache(UNREAD_COUNTS_KEY, unreadCounts);
        updateUnreadUi();
        updateAppBadge();
      }

      function markGroupRead(groupId) {
        if (!groupId) {
          return;
        }
        unreadCounts[groupId] = 0;
        readTimes[groupId] = Date.now();
        saveCache(UNREAD_COUNTS_KEY, unreadCounts);
        saveCache(READ_TIMES_KEY, readTimes);
        updateUnreadUi();
        updateAppBadge();
      }

      function updateUnreadUi() {
        var total = getTotalUnread();
        groupSelect.className = total ? "has-unread" : "";
        if (currentGroupName) {
          currentGroupName.className = "current-group" + (total ? " has-unread" : "");
        }
      }

      function updateAppBadge() {
        var total = getTotalUnread();
        if ("setAppBadge" in navigator) {
          if (total > 0) {
            navigator.setAppBadge(total).catch(function () {});
          } else if ("clearAppBadge" in navigator) {
            navigator.clearAppBadge().catch(function () {});
          }
        }
      }

      function getTotalUnread() {
        return Object.keys(unreadCounts).reduce(function (total, groupId) {
          return total + (Number(unreadCounts[groupId]) || 0);
        }, 0);
      }

      function formatGroupOptionLabel(group) {
        var name = group.groupName || group.groupId;
        var unread = Number(unreadCounts[group.groupId]) || 0;
        return unread ? "● " + name + "（" + unread + "）" : name;
      }

      function rememberMessageKeys(groupId, rows) {
        if (!groupId) {
          return;
        }
        var keys = liveMessageKeysByGroup[groupId] || {};
        rows.forEach(function (row) {
          keys[getMessageKey(row)] = true;
        });
        liveMessageKeysByGroup[groupId] = keys;
      }

      function getMessageKey(row) {
        return [
          getField(row, ["time", "timestamp", "datetime", "date"]),
          getField(row, ["sender", "senderName", "name", "userName"]),
          getField(row, ["groupId"]),
          getField(row, ["text", "body", "message"]),
          getField(row, ["messageType", "type"]),
          getField(row, ["imageUrl", "image", "mediaUrl"])
        ].join("|");
      }

      function isOwnMessage(row) {
        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "";
        return senderName === SENDER_NAME || getField(row, ["source", "sourceType"]) === "githubPages";
      }

      function showNewMessageNotification(row, count, groupId, groupName) {
        if (!notificationsEnabled || !("Notification" in window) || Notification.permission !== "granted") {
          return;
        }

        var senderName = getField(row, ["sender", "senderName", "name", "userName"]) || "新着";
        var text = getField(row, ["text", "body", "message"])
          || (getField(row, ["messageType", "type"]) === "image" ? "写真が届きました" : "");
        var titlePrefix = groupName ? groupName + " / " : "";
        var title = count > 1 ? titlePrefix + "新しいメッセージ " + count + "件" : titlePrefix + senderName + "から新着";
        var options = {
          body: text,
          icon: "assets/icon-192.png",
          badge: "assets/icon-192.png",
          tag: "yansan-chat-" + (groupId || selectedGroupId),
          renotify: true,
          data: {
            url: "./?groupId=" + encodeURIComponent(groupId || selectedGroupId),
            groupId: groupId || selectedGroupId
          }
        };

        if ("serviceWorker" in navigator) {
          ensureServiceWorkerReady().then(function (registration) {
            if (registration && registration.showNotification) {
              registration.showNotification(title, options).catch(function () {});
            }
          }).catch(function () {});
          return;
        }

        try {
          var notification = new Notification(title, options);
          notification.onclick = function () {
            window.focus();
            notification.close();
          };
        } catch (error) {}
      }

      function updateDeleteGroupButton() {
        deleteGroupButton.disabled = !groupSelect.value;
      }

      function openGroup(groupId) {
        setSelectedGroupId(groupId);
        groupSelect.value = groupId;
        markGroupRead(groupId);
        updateDeleteGroupButton();
        updateCurrentGroupName(getSelectedGroupName());
        latestSignature = "";
        showOlderMessages = false;
        renderCachedMessages(groupId);
        loadMessages();
      }

      function updateCurrentGroupName(name) {
        currentGroupName.textContent = name || "グループ未選択";
      }

      function getSelectedGroupName() {
        if (!groupSelect.value || groupSelect.selectedIndex < 0) {
          return "";
        }
        var group = findGroupById(groupSelect.value);
        return group ? group.groupName || group.groupId : groupSelect.options[groupSelect.selectedIndex].textContent;
      }

      function findGroupById(groupId) {
        for (var i = 0; i < groupsCache.length; i += 1) {
          if (groupsCache[i].groupId === groupId) {
            return groupsCache[i];
          }
        }
        return null;
      }

      function getDeletedGroupIds() {
        try {
          var value = localStorage.getItem(DELETED_GROUPS_KEY);
          var parsed = value ? JSON.parse(value) : [];
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          return [];
        }
      }

      function addDeletedGroupId(groupId) {
        var ids = getDeletedGroupIds();
        if (ids.indexOf(groupId) === -1) {
          ids.push(groupId);
          localStorage.setItem(DELETED_GROUPS_KEY, JSON.stringify(ids));
        }
      }

      function parseTime(value) {
        var time = value ? new Date(value).getTime() : 0;
        return Number.isNaN(time) ? 0 : time;
      }

      function scrollToBottom() {
        function move() {
          chatLog.scrollTop = chatLog.scrollHeight;
          window.scrollTo(0, document.documentElement.scrollHeight);
        }
        window.requestAnimationFrame(function () {
          move();
          window.setTimeout(function () {
            move();
          }, 60);
        });
      }

      function showStatus(message, type) {
        listStatus.textContent = message;
        listStatus.className = "status" + (type ? " " + type : "");
      }

      function formatCount(count) {
        if (!count) {
          return "0件";
        }
        return count + "件";
      }

      function getField(row, keys) {
        for (var i = 0; i < keys.length; i += 1) {
          if (row && row[keys[i]] !== undefined && row[keys[i]] !== null) {
            return String(row[keys[i]]);
          }
        }
        return "";
      }

      function formatTime(value) {
        if (!value) {
          return "";
        }
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return String(value);
        }
        return new Intl.DateTimeFormat("ja-JP", {
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }
    }());
  </script>
</body>
</html>
